# Netlify configuration for 10TH Portfolio

[build]
  # No build command needed for static site
  publish = "."

[[headers]]
  # HTML files - short cache, always revalidate
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  # JavaScript and CSS files - shorter cache for easier updates
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  # Images and 3D models - longer cache
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Redirects (if needed in future)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
